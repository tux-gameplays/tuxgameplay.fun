<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Home - Tux Gameplay.fun</title>
  <link rel="icon" href="res/tuxlogo.webp" type="image/webp">
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      scrollbar-width: none;
    }

    :root::-webkit-scrollbar {
      display: none;
    }

    body {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      background: #090811;
      color: #f7f5ff;
      font-family: Outfit, sans-serif;
    }

    .wave-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: #090811;
    }

    .wave-background svg {
      position: absolute;
      width: 150%;
      min-width: 1100px;
      height: 92vh;
      min-height: 520px;
      left: -20%;
      bottom: -9%;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, .12) 22%, #000 48%);
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, .12) 22%, #000 48%);
    }

    .wave-glow {
      fill: url(#wave-glow);
    }

    .wave-line {
      fill: none;
      stroke: #7862e8;
      stroke-width: 1.4;
      opacity: .28;
    }

    .wave-line-soft {
      fill: none;
      stroke: #a18eff;
      stroke-width: 1;
      opacity: .16;
    }

    .wave-drift {
      transform-origin: center;
      animation: waveDrift 16s ease-in-out infinite alternate;
    }

    .wave-drift-slow {
      transform-origin: center;
      animation: waveDrift 23s ease-in-out infinite alternate-reverse;
    }

    @keyframes waveDrift {
      from {
        transform: translate3d(-1.5%, 1%, 0) scale(1);
      }

      to {
        transform: translate3d(1.5%, -1%, 0) scale(1.025);
      }
    }

    .site-header {
      position: relative;
      z-index: 1;
      background: rgba(9, 8, 17, .62);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .site-header .navbar {
      width: 100%;
      min-height: 4.5rem;
      flex-wrap: nowrap;
      position: relative;
      z-index: 1;
    }

    .header-links {
      display: none;
      align-items: center;
      gap: 1.5rem;
    }

    .header-links a {
      color: #e2ddf2;
      font-weight: 500;
      text-decoration: none;
      transition: color .15s ease;
    }

    .header-links a:hover,
    .header-links a:focus-visible {
      color: #b9a7ff;
    }

    .hamburger-button {
      display: inline-flex;
      width: 2.75rem;
      height: 2.75rem;
      align-items: center;
      justify-content: center;
      margin-inline-end: .5rem;
      padding: .5rem;
      color: #f7f5ff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: .65rem;
    }

    .hamburger-button svg {
      width: 1.4rem;
      height: 1.4rem;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, .58);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .mobile-drawer {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 21;
      width: min(19rem, 86vw);
      padding: 1.25rem;
      color: #f7f5ff;
      background: #12101d;
      border-left: 1px solid rgba(255, 255, 255, .12);
      box-shadow: -1rem 0 3rem rgba(0, 0, 0, .3);
      transform: translateX(105%);
      visibility: hidden;
      transition: transform .3s cubic-bezier(.2, .7, .25, 1), visibility .3s;
    }

    .mobile-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }

    .mobile-drawer-brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-inline-start: .5rem;
    }

    .mobile-drawer-logo {
      width: 2rem;
      height: 2rem;
      object-fit: cover;
      border-radius: 50%;
    }

    .mobile-drawer-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .mobile-drawer-close {
      color: #e2ddf2;
      background: transparent;
      border: 0;
      font-size: 1.7rem;
      line-height: 1;
    }

    .mobile-drawer-links {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      margin-top: 1rem;
    }

    .mobile-drawer-links a {
      padding: .85rem .75rem;
      color: #f7f5ff;
      font-size: 1.05rem;
      text-decoration: none;
      border-radius: .55rem;
    }

    .mobile-drawer-links a:hover,
    .mobile-drawer-links a:focus-visible {
      color: #d6ceff;
      background: rgba(135, 111, 240, .16);
    }

    body.drawer-open .drawer-backdrop {
      opacity: 1;
      visibility: visible;
    }

    body.drawer-open .mobile-drawer {
      transform: translateX(0);
      visibility: visible;
    }

    @media (min-width: 768px) {
      .header-links {
        display: flex;
      }

      .hamburger-button {
        display: none;
      }
    }

    .site-header .navbar-brand {
      min-width: 0;
      margin: 0;
      margin-inline-start: .5rem;
      padding-block: .375rem;
      gap: .625rem !important;
    }

    .brand-mark {
      width: 2.25rem;
      height: 2.25rem;
      flex: 0 0 2.25rem;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand-name {
      color: #f7f5ff;
      font-size: clamp(.9rem, 4vw, 1rem);
      font-weight: 600;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .hero {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 4.5rem);
    }

    .hero h1 {
      max-width: 850px;
      font-size: clamp(2.5rem, 7vw, 4.75rem);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1.08;
    }

    .hero p {
      color: #d0cddd;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
    }

    .fade-in-right {
      opacity: 0;
      transform: translateX(28px);
      animation: fadeInRight .85s cubic-bezier(.2, .7, .25, 1) forwards;
    }

    .hero .buttons.fade-in-right {
      animation-delay: .52s;
    }

    @keyframes fadeInRight {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .hero-title-brand {
      white-space: nowrap;
    }

    .letter-reveal>span {
      display: inline-block;
      white-space: pre;
      opacity: 0;
      transform: translateX(.3em);
      animation: letterReveal .42s cubic-bezier(.2, .7, .25, 1) forwards;
      animation-delay: var(--letter-delay);
    }

    @keyframes letterReveal {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .btn {
      --bs-btn-font-size: 1.125rem;
      --bs-btn-font-weight: 600;
      --bs-btn-padding-x: 2rem;
      --bs-btn-padding-y: 1rem;
      --bs-btn-border-radius: .65rem;
    }

    .btn-solid {
      --bs-theme-bg: #6558d3;
      --bs-theme-contrast: #fff;
    }

    .btn-git {
      --bs-theme-bg: #e87524;
      --bs-theme-contrast: #fff;
    }

    .btn-outline {
      --bs-btn-color: #343843;
      --bs-btn-border-color: #c8cbd2;
      --bs-btn-hover-bg: #f1f2f5;
      --bs-btn-hover-color: #20232a;
      --bs-btn-hover-border-color: #9ca1ac;
    }

    .btn-fluxer {
      min-width: 11rem;
    }

    .fluxer-icon {
      width: 1.5rem;
      height: 1.5rem;
      flex: 0 0 auto;
    }

    .menu {
      --bs-menu-min-width: 12rem;
      --bs-menu-bg: #fff;
      --bs-menu-color: #20232a;
      --bs-menu-border-color: #e6e8ec;
      --bs-menu-item-color: #29234c;
      --bs-menu-item-hover-color: #29234c;
      --bs-menu-item-hover-bg: #f0edff;
      --bs-menu-item-active-color: #29234c;
      --bs-menu-item-active-bg: #e8e2ff;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: .65rem;
      text-decoration: none;
    }

    .menu .menu-item {
      color: #29234c;
    }

    .menu .menu-item:hover,
    .menu .menu-item:focus-visible {
      color: #29234c;
      background-color: #f0edff;
    }

    .menu .menu-item:active,
    .menu .menu-item.active {
      color: #29234c;
      background-color: #e8e2ff;
    }

    .menu-item-icon {
      width: 1.25rem;
      height: 1.25rem;
      flex: 0 0 auto;
    }

    .menu-chevron {
      margin-left: auto;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }

      .fade-in-right {
        opacity: 1;
        transform: none;
      }

      .letter-reveal>span {
        opacity: 1;
        transform: none;
        animation: none;
      }

      .drawer-backdrop,
      .mobile-drawer {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <script>
    function revealText(element, delay = 0) {
      const text = element.textContent;
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      element.setAttribute('aria-label', text);
      let index = 0;
      for (const node of textNodes) {
        const fragment = document.createDocumentFragment();
        for (const character of Array.from(node.textContent)) {
          const letter = document.createElement('span');
          letter.setAttribute('aria-hidden', 'true');
          letter.textContent = character;
          letter.style.setProperty('--letter-delay', `${delay + index++ * 28}ms`);
          fragment.appendChild(letter);
        }
        node.replaceWith(fragment);
      }
      return Array.from(text).length * 28;
    }

    const [heroTitle, heroDescription] = document.querySelectorAll('.letter-reveal');
    const titleRevealDuration = revealText(heroTitle);
    revealText(heroDescription, titleRevealDuration + 120);

    const menuToggle = document.getElementById('community-menu-toggle');
    const communityMenu = document.getElementById('community-menu');
    const repositoryToggle = document.getElementById('github-menu-toggle');
    const repositoryMenu = document.getElementById('repository-menu');
    const closeCommunityMenu = () => {
      communityMenu.classList.remove('show');
      menuToggle.setAttribute('aria-expanded', 'false');
    };
    const closeRepositoryMenu = () => {
      repositoryMenu.classList.remove('show');
      repositoryToggle.setAttribute('aria-expanded', 'false');
    };

    menuToggle.addEventListener('click', () => {
      const isOpen = communityMenu.classList.toggle('show');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) closeRepositoryMenu();
    });
    repositoryToggle.addEventListener('click', () => {
      const isOpen = repositoryMenu.classList.toggle('show');
      repositoryToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) closeCommunityMenu();
    });
    document.addEventListener('click', (event) => {
      if (!menuToggle.parentElement.contains(event.target)) closeCommunityMenu();
      if (!repositoryToggle.parentElement.contains(event.target)) closeRepositoryMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        const repositoryWasOpen = repositoryMenu.classList.contains('show');
        closeCommunityMenu();
        closeRepositoryMenu();
        (repositoryWasOpen ? repositoryToggle : menuToggle).focus();
      }
    });

    const drawer = document.getElementById('mobile-drawer');
    const drawerToggle = document.getElementById('mobile-menu-open');
    const setDrawerOpen = (isOpen) => {
      document.body.classList.toggle('drawer-open', isOpen);
      drawerToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) {
        drawer.removeAttribute('aria-hidden');
        drawer.removeAttribute('inert');
      } else {
        drawer.setAttribute('aria-hidden', 'true');
        drawer.setAttribute('inert', '');
      }
    };

    const closeDrawer = () => {
      setDrawerOpen(false);
      drawerToggle.focus();
    };

    drawerToggle.addEventListener('click', () => {
      setDrawerOpen(true);
      document.getElementById('mobile-menu-close').focus();
    });
    document.getElementById('mobile-menu-close').addEventListener('click', closeDrawer);
    document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
    drawer.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setDrawerOpen(false)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.body.classList.contains('drawer-open')) closeDrawer();
    });
  </script>
